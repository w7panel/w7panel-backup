localS3:
  enabled: true
  image: versity/versitygw:v1.10.0
  storageClass: local-path
  size: 10Gi
  bucket: velero
  accessKey: w7panel-velero
  secretKey: ""

# Enable this on upgrades from installations using the bundled MinIO.
legacyMinio:
  enabled: false
  image: minio/minio:RELEASE.2024-10-29T16-01-48Z
  storageClass: local-path
  size: 10Gi
  accessKey: w7panel-velero
  secretKey: change-me-before-production
  bucket: velero

velero:
  upgradeCRDs: false
  credentials:
    useSecret: true
    existingSecret: local-s3-credentials
  configuration:
    defaultBackupStorageLocation: local
    defaultVolumesToFsBackup: false
    backupSyncPeriod: 1m
    backupStorageLocation: []
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.12.2
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins
  deployNodeAgent: false
  snapshotsEnabled: false
