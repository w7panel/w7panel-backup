{{- $existing := lookup "v1" "Secret" .Release.Namespace "local-s3-auth" -}}
{{- $secret := .Values.localS3.secretKey -}}
{{- if not $secret -}}
  {{- if $existing -}}
    {{- $secret = index $existing.data "secretKey" | b64dec -}}
  {{- else -}}
    {{- $secret = randAlphaNum 40 -}}
  {{- end -}}
{{- end -}}
{{- if .Values.localS3.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: local-s3-auth
type: Opaque
stringData:
  accessKey: {{ .Values.localS3.accessKey | quote }}
  secretKey: {{ $secret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: local-s3-credentials
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  cloud: |-
    [default]
    aws_access_key_id={{ .Values.localS3.accessKey }}
    aws_secret_access_key={{ $secret }}
{{- end }}
{{- if .Values.legacyMinio.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  cloud: |-
    [default]
    aws_access_key_id={{ .Values.legacyMinio.accessKey }}
    aws_secret_access_key={{ .Values.legacyMinio.secretKey }}
{{- end }}
