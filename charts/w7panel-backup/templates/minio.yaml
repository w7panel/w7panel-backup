{{- if .Values.legacyMinio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "w7panel-backup.minioName" . }}
  labels:
    app.kubernetes.io/name: w7panel-backup-minio
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.legacyMinio.accessKey | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.legacyMinio.secretKey | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "w7panel-backup.minioName" . }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.legacyMinio.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.legacyMinio.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "w7panel-backup.minioName" . }}
  labels:
    app.kubernetes.io/name: w7panel-backup-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: w7panel-backup-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: w7panel-backup-minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.legacyMinio.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /data/{{ .Values.legacyMinio.bucket | quote }}
              exec minio server /data --console-address :9001
          envFrom:
            - secretRef:
                name: {{ include "w7panel-backup.minioName" . }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "w7panel-backup.minioName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "w7panel-backup.minioName" . }}
spec:
  selector:
    app.kubernetes.io/name: w7panel-backup-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
{{- end }}
