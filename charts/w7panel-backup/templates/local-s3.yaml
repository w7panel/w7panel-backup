{{- $old := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (include "w7panel-backup.minioName" .) -}}
{{- if and $old (not .Values.legacyMinio.enabled) -}}
{{- fail "Existing MinIO PVC detected: set legacyMinio.enabled=true to retain historical backups before upgrading" -}}
{{- end -}}
{{- if .Values.localS3.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "w7panel-backup.s3Name" . }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  {{- if not (has .Values.localS3.accessMode (list "ReadWriteOnce" "ReadWriteMany")) }}
  {{- fail "localS3.accessMode must be ReadWriteOnce or ReadWriteMany" }}
  {{- end }}
  accessModes: [{{ .Values.localS3.accessMode }}]
  {{- with default .Values.localS3.storageClass .Values.storageclass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.localS3.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "w7panel-backup.s3Name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "w7panel-backup.s3Name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "w7panel-backup.s3Name" . }}
    spec:
      initContainers:
        - name: bucket
          image: busybox:1.36
          command: [sh, -ec]
          args: ["mkdir -p /data/{{ .Values.localS3.bucket }}"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: s3
          image: {{ .Values.localS3.image | quote }}
          args: ["--port", ":7070", "posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: local-s3-auth, key: accessKey } }
            - name: ROOT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: local-s3-auth, key: secretKey } }
          ports:
            - name: s3
              containerPort: 7070
          readinessProbe:
            tcpSocket: { port: s3 }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "w7panel-backup.s3Name" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "w7panel-backup.s3Name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "w7panel-backup.s3Name" . }}
  ports:
    - name: s3
      port: 7070
      targetPort: s3
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: local
spec:
  provider: aws
  default: true
  accessMode: ReadWrite
  objectStorage:
    bucket: {{ .Values.localS3.bucket | quote }}
  credential:
    name: local-s3-credentials
    key: cloud
  config:
    region: us-east-1
    s3ForcePathStyle: "true"
    s3Url: {{ printf "http://%s:7070" (include "w7panel-backup.s3Name" .) | quote }}
{{- end }}
{{- if .Values.legacyMinio.enabled }}
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
spec:
  provider: aws
  default: false
  accessMode: ReadOnly
  objectStorage:
    bucket: {{ .Values.legacyMinio.bucket | quote }}
  credential:
    name: cloud-credentials
    key: cloud
  config:
    region: minio
    s3ForcePathStyle: "true"
    s3Url: {{ printf "http://%s:9000" (include "w7panel-backup.minioName" .) | quote }}
{{- end }}
